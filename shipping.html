<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>네퓨어 출고 안내</title>
  
  <!-- 스마트폰 홈 화면 바로가기 실행 최적화 메타 태그 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="출고관리">
  <meta name="theme-color" content="#00c73c">

  <style>
    :root {
      --primary-color: #00c73c;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #222222;
      
      --cat-premium: #71a3ff;
      --cat-nepure: #ff9b53;
      --cat-ato: #f2c94c;
      --cat-dust: #9b51e0;
      --cat-grade: #4cc9c0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 250px; /* 미리보기 높이 확장에 맞춰 하단 여백 조정 */
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .cat-btn {
      border: none;
      border-radius: 20px;
      padding: 12px 8px;
      font-size: 0.95rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      transition: transform 0.1s, opacity 0.2s;
      text-align: center;
    }

    .cat-btn:active {
      transform: scale(0.96);
    }

    .cat-btn.active {
      outline: 3px solid #333;
    }

    .cat-premium { background-color: var(--cat-premium); }
    .cat-nepure { background-color: var(--cat-nepure); }
    .cat-ato { background-color: var(--cat-ato); }
    .cat-dust { background-color: var(--cat-dust); }
    .cat-grade { background-color: var(--cat-grade); }

    .product-section {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 14px;
    }

    .product-title {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .product-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .product-chip {
      background: #f0f2f5;
      border: 1px solid #e0e4e9;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .product-chip:active {
      background: #e2e7ec;
    }

    .lot-section {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .lot-input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
      user-select: text;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .numpad-modal {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .numpad-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .numpad-target-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
    }

    .numpad-display {
      background: #f8f9fa;
      border: 2px solid #00c73c;
      border-radius: 10px;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: right;
      padding: 10px 16px;
      margin-bottom: 14px;
      color: #111;
    }

    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .num-btn {
      background: #f0f2f5;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }

    .num-btn:active {
      background: #d8dce2;
    }

    .num-btn.btn-del {
      background: #ffebee;
      color: #d32f2f;
    }

    .num-btn.btn-clear {
      background: #fff3e0;
      color: #e65100;
    }

    .numpad-actions {
      display: flex;
      gap: 10px;
    }

    .btn-confirm {
      flex: 2;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.1rem
